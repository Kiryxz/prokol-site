<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101114"><title>Про.Кол — ТВ-расписание</title>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#1b1d22;--line:#373941;--orange:#ff791f;--muted:#b7bac2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8f8f8;font:20px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit;border-radius:12px;padding:12px}button{border:0;cursor:pointer;font-weight:800;background:#34363d;color:white}button.primary{background:var(--orange);color:#16110d}input{background:#131419;border:1px solid #50525a;color:white;width:100%}.hidden{display:none!important}header{padding:20px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;border-bottom:2px solid #34363d}.brand{font-weight:950;font-size:37px}.brand b{color:var(--orange)}.muted{color:var(--muted)}.right{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.clock{font-size:35px;font-weight:850}.date{font-size:22px}main{padding:20px 26px}.notice{background:#58391b;border:2px solid var(--orange);border-radius:14px;padding:16px 22px;margin-bottom:18px;font-size:28px;font-weight:800}.daytabs{display:flex;gap:12px;margin-bottom:18px}.daytabs button{font-size:23px;padding:13px 25px}.daytabs button.selected{background:var(--orange);color:#17110c}.summary{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px}.summary span{background:#22252b;border-radius:12px;padding:10px 17px;font-weight:700}.summary strong{color:#ffab6e}.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.slot{border:2px solid #3a3c44;border-radius:16px;padding:14px;background:var(--panel);min-height:142px}.slot.current{border-color:var(--orange);box-shadow:0 0 0 2px #ff791f40}.slothead{display:flex;justify-content:space-between;align-items:center;gap:8px}.hour{font-size:30px;font-weight:900}.capacity{font-size:17px;color:#d2d4d9}.booking{margin-top:10px;padding:10px 12px;background:#292c33;border-radius:10px;border-left:5px solid #ff9d52;font-size:20px}.booking.confirmed{border-color:#53c887}.booking.completed{border-color:#7e98b8;opacity:.7}.booking.cancelled{border-color:#a56767;opacity:.6}.service{font-weight:850}.details{color:#d1d3d8;font-size:17px}.empty{color:#a7abb4;margin-top:20px}.login{max-width:470px;margin:8vh auto;background:var(--panel);border:1px solid var(--line);padding:28px;border-radius:18px}.login input,.login button{margin:8px 0;width:100%}.status{font-size:15px;color:var(--muted)}@media(max-width:1100px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.slots{grid-template-columns:1fr}header,main{padding:14px}.clock{font-size:27px}.brand{font-size:29px}}
</style></head><body>
<section id="login" class="login"><div class="brand">Про<b>.</b>Кол 📺</div><h2>Вход в ТВ-расписание</h2><form id="loginForm"><input id="email" type="email" placeholder="Электронная почта" autocomplete="username" required><input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required><button id="loginBtn" class="primary" disabled>Подключаемся…</button></form><p class="status" id="loginStatus"></p></section>
<div id="app" class="hidden"><header><div><div class="brand">Про<b>.</b>Кол · 📺 Расписание</div><div id="date" class="date muted"></div></div><div class="right"><div id="clock" class="clock"></div><button id="soundBtn">🔕 Звук выключен</button><button id="refreshBtn">↻ Обновить</button><button id="logoutBtn">Выйти</button></div></header><main><div class="daytabs"><button id="todayTab" class="selected" aria-pressed="true">📅 Сегодня</button><button id="tomorrowTab" aria-pressed="false">📆 Завтра</button></div><div id="notice" class="notice hidden" role="status"></div><div class="summary"><span>Ожидают: <strong id="pending">0</strong></span><span>Подтверждены: <strong id="confirmed">0</strong></span><span>Свободно мест: <strong id="free">24</strong></span><span id="updated" class="status">Загрузка…</span></div><div id="slots" class="slots"></div><p class="status" id="status"></p></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id),TZ='Europe/Moscow',ACTIVE=new Set(['pending','confirmed']);
let client,authorized=false,loading=false,initialized=false,knownIds=new Set(),soundEnabled=false,audioContext=null,noticeTimer=null,selectedDay='today',knownAllIds=new Set(),globalInitialized=false;
const fmt=(options)=>new Intl.DateTimeFormat('ru-RU',{timeZone:TZ,...options}).format(new Date());
const day=()=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`};
const nextDay=()=>{const d=new Date(Date.now()+86400000);const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d).map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`};
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
function showAuth(ok){authorized=ok;$('login').classList.toggle('hidden',ok);$('app').classList.toggle('hidden',!ok);if(!ok){initialized=false;globalInitialized=false;knownIds.clear();knownAllIds.clear();$('slots').replaceChildren()}}
function tick(){$('clock').textContent=fmt({hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});$('date').textContent=fmt({weekday:'long',day:'numeric',month:'long',year:'numeric'});const hour=fmt({hour:'2-digit',hourCycle:'h23'});document.querySelectorAll('.slot').forEach(n=>n.classList.toggle('current',n.dataset.hour===hour))}
function beep(){if(!soundEnabled)return;try{audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=880;g.gain.value=.13;o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.22)}catch(e){console.warn('Звук недоступен',e)}}
function announce(count){$('notice').textContent=`🔔 Новых записей: ${count} — обновите взгляд на расписание!`;$('notice').classList.remove('hidden');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').classList.add('hidden'),30000);beep()}
function render(rows){const active=rows.filter(b=>ACTIVE.has(b.status));$('pending').textContent=rows.filter(b=>b.status==='pending').length;$('confirmed').textContent=rows.filter(b=>b.status==='confirmed').length;$('free').textContent=Math.max(0,24-active.length);$('slots').replaceChildren();for(let h=9;h<=20;h++){const hour=String(h).padStart(2,'0'),items=rows.filter(b=>String(b.requested_time||'').slice(0,2)===hour),used=items.filter(b=>ACTIVE.has(b.status)).length;const slot=el('section','slot');slot.dataset.hour=hour;const head=el('div','slothead');head.append(el('span','hour',hour+':00'),el('span','capacity',`${used}/2 занято`));slot.append(head);if(!items.length)slot.append(el('div','empty','Свободно'));for(const b of items){const card=el('div','booking '+(b.status||''));card.append(el('div','service',b.service||'Услуга не указана'));const labels={pending:'🟠 Ожидает',confirmed:'🟢 Подтверждена',completed:'✓ Выполнена',cancelled:'✕ Отменена'};card.append(el('div','details',`${b.wheel_size?b.wheel_size+' · ':''}${labels[b.status]||b.status||''}`));slot.append(card)}$('slots').append(slot)}tick()}
async function load(){
 if(!authorized||loading)return;loading=true;
 try{
  const currentDay=selectedDay==='today'?day():nextDay();
  const [dayResult,allResult]=await Promise.all([
   client.from('bookings').select('id,service,wheel_size,requested_time,status,created_at').eq('requested_date',currentDay).order('requested_time',{ascending:true}).limit(1000),
   client.from('bookings').select('id,created_at').order('created_at',{ascending:false}).limit(1000)
  ]);
  if(dayResult.error)throw dayResult.error;
  if(allResult.error)throw allResult.error;
  if(!authorized)return;
  const rows=dayResult.data||[];
  const allIds=new Set((allResult.data||[]).map(b=>b.id));
  if(globalInitialized){const added=[...allIds].filter(id=>!knownAllIds.has(id));if(added.length)announce(added.length)}
  globalInitialized=true;knownAllIds=allIds;
  knownIds=new Set(rows.map(b=>b.id));initialized=true;
  render(rows);
  $('updated').textContent='Обновлено: '+fmt({hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  $('status').textContent=`Показаны записи на ${currentDay}. Проверка новых заявок на любые даты каждые 3 минуты.`;
 }catch(e){console.error(e);$('status').textContent='⚠️ Не удалось обновить данные. Проверьте интернет и права доступа. Предыдущие данные могут быть устаревшими.'}
 finally{loading=false}
}
function chooseDay(which){selectedDay=which;for(const [key,id] of [['today','todayTab'],['tomorrow','tomorrowTab']]){const on=key===which;$(id).classList.toggle('selected',on);$(id).setAttribute('aria-pressed',String(on))}load()}
$('todayTab').addEventListener('click',()=>chooseDay('today'));
$('tomorrowTab').addEventListener('click',()=>chooseDay('tomorrow'));
$('soundBtn').addEventListener('click',async()=>{soundEnabled=!soundEnabled;$('soundBtn').textContent=soundEnabled?'🔔 Звук включён':'🔕 Звук выключен';if(soundEnabled){try{audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();await audioContext.resume();beep()}catch(e){$('status').textContent='Браузер телевизора не разрешил звук.'}}});
$('refreshBtn').addEventListener('click',load);
$('logoutBtn').addEventListener('click',async()=>{await client.auth.signOut();showAuth(false)});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;try{const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';showAuth(true);await load()}catch(err){console.error(err);$('loginStatus').textContent='Не удалось войти. Проверьте логин и пароль.'}finally{$('loginBtn').disabled=false}});
(async()=>{try{const c=window.PROKOL_CONFIG;if(!c?.supabaseUrl||!c?.supabaseKey)throw Error('Не найден config.js');if(!window.supabase?.createClient)throw Error('Библиотека Supabase не загрузилась');client=window.supabase.createClient(c.supabaseUrl,c.supabaseKey);$('loginBtn').disabled=false;$('loginBtn').textContent='Войти';const {data:{session},error}=await client.auth.getSession();if(error)throw error;showAuth(!!session);if(session)await load()}catch(e){console.error(e);$('loginStatus').textContent='Ошибка подключения: '+e.message;$('loginBtn').textContent='Подключение недоступно'}})();
setInterval(tick,1000);setInterval(()=>{if(authorized)load()},180000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&authorized)load()});
</script></body></html>
