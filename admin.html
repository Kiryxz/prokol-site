
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Про.Кол. — Панель администратора</title>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #101010;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    h1 { color: #ff6a00; margin-bottom: 8px; }

    .muted { color: #aaa; }

    .panel {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 22px;
      margin-top: 20px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 15px;
    }

    input {
      color: white;
      background: #111;
      border: 1px solid #444;
    }

    button {
      cursor: pointer;
      border: none;
      font-weight: bold;
    }

    .primary { background: #ff6a00; color: #111; }
    .secondary { background: #333; color: white; }
    .danger { background: #762a2a; color: white; }

    .hidden { display: none !important; }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar input { max-width: 220px; }
    .toolbar button { width: auto; }

    .booking {
      background: #242424;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      padding: 16px;
      margin-top: 12px;
    }

    .booking h3 { margin: 0 0 8px; }
    .booking p { margin: 6px 0; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .actions button { width: auto; flex: 1; min-width: 130px; }

    .status { color: #ffb36f; font-weight: bold; }
    #message { white-space: pre-wrap; margin-top: 12px; }
    
    @media (max-width: 600px) {
      body { padding: 14px; }
      .panel { padding: 16px; }
      .toolbar input, .toolbar button { max-width: none; width: 100%; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Про.Кол.</h1>
    <p class="muted">Панель администратора</p>

    <section id="loginPanel" class="panel">
      <h2>Вход</h2>
      <form id="loginForm">
        <input id="email" type="email" placeholder="Электронная почта" required>
        <input id="password" type="password" placeholder="Пароль" required>
        <button class="primary" type="submit">Войти</button>
      </form>
      <p id="loginMessage" class="muted"></p>
    </section>

    <section id="adminPanel" class="panel hidden">
      <div class="toolbar">
        <h2 style="flex:1">Записи</h2>
        <button id="refreshBtn" class="secondary" type="button">Обновить</button>
        <button id="logoutBtn" class="danger" type="button">Выйти</button>
      </div>

      <div class="toolbar">
        <label for="filterDate">Дата:</label>
        <input id="filterDate" type="date">
        <button id="todayBtn" class="secondary" type="button">Сегодня</button>
        <button id="allBtn" class="secondary" type="button">Все записи</button>
      </div>

      <p id="message" class="muted"></p>
      <div id="bookingsList"></div>
    </section>
  </main>

  <script>
    const config = window.PROKOL_CONFIG;
    const client = window.supabase.createClient(
      config.supabaseUrl,
      config.supabaseKey
    );

    const loginPanel = document.getElementById('loginPanel');
    const adminPanel = document.getElementById('adminPanel');
    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');
    const message = document.getElementById('message');
    const bookingsList = document.getElementById('bookingsList');
    const filterDate = document.getElementById('filterDate');

    const statusNames = {
      pending: 'Ожидает подтверждения',
      confirmed: 'Подтверждена',
      cancelled: 'Отменена',
      completed: 'Выполнена'
    };

    function localDateString(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    async function showCurrentSession() {
      const { data: { session } } = await client.auth.getSession();

      loginPanel.classList.toggle('hidden', !!session);
      adminPanel.classList.toggle('hidden', !session);

      if (session) await loadBookings();
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginMessage.textContent = 'Входим…';

      const { error } = await client.auth.signInWithPassword({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      });

      if (error) {
        loginMessage.textContent = 'Не удалось войти. Проверь почту и пароль.';
        console.error(error);
        return;
      }

      loginMessage.textContent = '';
      await showCurrentSession();
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await client.auth.signOut();
      bookingsList.replaceChildren();
      await showCurrentSession();
    });

    document.getElementById('refreshBtn').addEventListener('click', loadBookings);

    document.getElementById('todayBtn').addEventListener('click', () => {
      filterDate.value = localDateString();
      loadBookings();
    });

    document.getElementById('allBtn').addEventListener('click', () => {
      filterDate.value = '';
      loadBookings();
    });

    filterDate.addEventListener('change', loadBookings);

    async function loadBookings() {
      message.textContent = 'Загружаем записи…';
      bookingsList.replaceChildren();

      let query = client
        .from('bookings')
        .select('id, name, phone, service, wheel_size, requested_date, requested_time, comment, status, created_at')
        .order('requested_date', { ascending: true })
        .order('requested_time', { ascending: true });

      if (filterDate.value) {
        query = query.eq('requested_date', filterDate.value);
      }

      const { data, error } = await query;

      if (error) {
        console.error(error);
        message.textContent = 'Не удалось загрузить записи. Проверь права доступа и политики RLS.';
        return;
      }

      if (!data.length) {
        message.textContent = 'Записей на выбранную дату нет.';
        return;
      }

      message.textContent = `Найдено записей: ${data.length}`;

      data.forEach(booking => {
        const card = document.createElement('article');
        card.className = 'booking';

        const title = document.createElement('h3');
        title.textContent = `${booking.requested_time} — ${booking.name || 'Без имени'}`;
        card.appendChild(title);

        const details = [
          `Дата: ${booking.requested_date}`,
          `Телефон: ${booking.phone || 'не указан'}`,
          `Услуга: ${booking.service || 'не указана'}`,
          `Размер колёс: ${booking.wheel_size || 'не указан'}`,
          `Комментарий: ${booking.comment || 'нет'}`,
          `Статус: ${statusNames[booking.status] || booking.status}`
        ];

        details.forEach(detail => {
          const p = document.createElement('p');
          p.textContent = detail;
          card.appendChild(p);
        });

        const actions = document.createElement('div');
        actions.className = 'actions';

        if (booking.status === 'pending') {
          actions.appendChild(makeActionButton('Подтвердить', 'confirmed', booking.id, 'primary'));
          actions.appendChild(makeActionButton('Отменить', 'cancelled', booking.id, 'danger'));
        } else if (booking.status === 'confirmed') {
          actions.appendChild(makeActionButton('Выполнена', 'completed', booking.id, 'primary'));
          actions.appendChild(makeActionButton('Отменить', 'cancelled', booking.id, 'danger'));
        }

        if (actions.childElementCount) card.appendChild(actions);
        bookingsList.appendChild(card);
      });
    }

    function makeActionButton(label, status, id, className) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = className;
      button.textContent = label;
      button.addEventListener('click', async () => {
        button.disabled = true;

        const { error } = await client
          .from('bookings')
          .update({ status, updated_at: new Date().toISOString() })
          .eq('id', id);

        if (error) {
          console.error(error);
          message.textContent = 'Не удалось изменить статус. Проверь права доступа.';
          button.disabled = false;
          return;
        }

        await loadBookings();
      });

      return button;
    }

    showCurrentSession();
  </script>
</body>
</html>
